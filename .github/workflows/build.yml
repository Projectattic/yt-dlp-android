name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          # Unlocks signing/release.p12, so every APK can install as an update.
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::SIGNING_PASSWORD secret not set; APKs are signed with a throwaway debug key and no release is published."
          else
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log

      # On failure, publish the build log to the ci-logs branch so it can be read with git.
      - name: Save build log
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not|> " /tmp/build.log | head -200 > errors.txt || true
          tail -400 /tmp/build.log > build-tail.log
          git add errors.txt build-tail.log
          git commit -m "Build log for run ${{ github.run_number }} (${{ github.sha }})"
          git push -f origin ci-logs

      - name: Collect APKs
        run: |
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/yt-dlp-direct-$abi.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      - name: Publish release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: yt-dlp Direct 1.0.${{ github.run_number }}
          body: |
            Most phones: download **yt-dlp-direct-arm64-v8a.apk**.
            (armeabi-v7a is for older 32-bit phones, x86_64 for emulators.)
          files: dist/*.apk
